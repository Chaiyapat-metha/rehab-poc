# File: .\backend\training\training_configs\model_config.yaml

model:
  backbone:
    type: "TCN_GRU"
    tcn:
      blocks: 1
      kernel_size: 3
      dilation_levels: [2]
    gru:
      layers: 1
      hidden: 256
      bidirectional: false
      dropout: 0.0
  heads:
    Jump_squats:
      type: "multi-task"
      # Input features: World Coordinates (x,y,z) for all 33 joints
      outputs:
        classification:
          num_classes: 2             # correct / wrong
          loss: "BCEWithLogitsLoss"
          weight: 1.0
        regression_angles:
          metrics_source: "exercises.yaml" # Refer to angle_output_order in exercises.yaml
          loss: "GaussianNLLLoss" # Use NLL since we predict logvar for uncertainty
          weight: 0.8
        regression_pos: 
          output_dim: 99
          loss: "L1Loss"
          weight: 0.2

    Stretching_upper_trapezius:
      type: "multi-task"
      outputs:
        classification:
          num_classes: 3             # good / left high / right high
          loss: "CrossEntropyLoss"
          weight: 1.0
        regression_angles:
          metrics_source: "exercises.yaml"
          loss: "GaussianNLLLoss"
          weight: 0.5
          
training:
  optimizer:
    type: "Adam"
    lr: 1e-3
    weight_decay: 1e-5
  loss:
    total: "weighted_sum"
    balance_strategy: "auto_scale"
  batch_size: 32
  epochs: 20
  seed: 42
  
data:
  dataset_path: "./data/"
  split_ratio: [0.7, 0.15, 0.15]   # train/val/test
  augmentation_config: "./augmentation.yaml"
  exercises_config: "./exercises.yaml"

inference:
  export:
    backbone: "./weights/backbone.onnx"
    heads_dir: "./weights/"
  device: "cuda"    # or "cpu"
  threshold_controller:
    mode: "external"    # manage personalization outside model
    smoothing: true
    min_success_before_update: 3