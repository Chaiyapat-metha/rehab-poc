syntax = "proto3";

package rehab;

// ข้อมูล Joint จาก BlazePose
message Joint {
  int32 id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float visibility = 5;
}

// ข้อมูลในแต่ละเฟรม
message Frame {
  string user_id = 1;
  string session_id = 2;
  int64 frame_no = 3;
  double timestamp = 4; // Unix timestamp
  repeated Joint joints = 5; // Raw joints data
  repeated float features = 6; // Engineered features vector
  repeated string labels_th = 7; // Labels ภาษาไทย (ถ้ามี)
}

// ข้อมูล Metadata ของแต่ละ Session
message Session {
  string session_id = 1;
  string user_id = 2;
  string device_info = 3; // e.g., "iPhone 11, Safari"
  double start_ts = 4;
  double end_ts = 5;
  bytes calibration_data = 6; // Protobuf ของ Frame ที่ใช้ calibrate
}

// ข้อมูล Caption จาก ASR
message Caption {
  string session_id = 1;
  double start_time = 2;
  double end_time = 3;
  string text = 4;
}

// Multi-Task Ground Truth Labels
message TrainingLabels {
    string exercise_id = 1;
    int32 label_class = 2; // Classification Head Label
    repeated float label_angles_vector = 3; // Angle Regression Head Labels
    repeated float label_pos_vector = 4;  // Positional Head Labels
    bool is_valid_for_training = 5; // Metadata 
}

// Real-Time Inference Output (Response to Client)**
message InferenceResult {
    string exercise_id = 1;

    // Classification Output
    bool is_wrong = 2;
    float class_confidence = 3; // Confidence score/Probability

    // Positional / Joint Error Output
    repeated int32 wrong_joints_indices = 4; // Indices (e.g., [14] for elbow)
    map<int32, float> joint_errors_mm = 5; // Per-joint error in mm

    // Angle Regression Output
    map<string, float> angle_values = 6; // Current angle values (e.g., "LEFT_KNEE": 82.0)
    map<string, float> angle_errors = 7; // Angle error relative to ground truth/target (e.g., "LEFT_KNEE": 5.2)

    // Feedback (for Text/TTS engine)
    string tts_text = 8;
    string display_text = 9;
}